# Checks every pull request and every push to main: the same checks a contributor runs locally
# (docs/development.md). A push to main that passes them is built for the hosts on the dev channel (dev-build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# read-only token: CI never writes to the repository
permissions:
  contents: read

# a newer push to the same branch or pull request cancels the run still going for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # warnings are errors here: trim warnings in particular mean the host's trimmed binary may break
      - name: Build
        run: dotnet build backend/HomeBackend.slnx --nologo -warnaserror
      - name: Test
        run: dotnet test --solution backend/HomeBackend.slnx --no-build
      # the build the host runs (self-contained, trimmed), into a scratch directory instead of deploy/app
      - name: Publish as for the host
        run: dotnet publish backend/HomeBackend -p:PublishProfile=Home -p:PublishDir="$RUNNER_TEMP/app/" --nologo -warnaserror

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      # types, ESLint, Prettier, tests
      - run: npm run check

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # every shell script in deploy/ and .github/, and build.sh (picked by its #! line; unit files and the polkit
      # rule are not shell)
      - name: shellcheck
        run: |
          files=$(git ls-files deploy .github build.sh | while read -r f; do
            if head -c 64 "$f" | head -n 1 | grep -q '^#!.*sh'; then echo "$f"; fi
          done)
          echo "$files"
          shellcheck $files

  # What the hosts on the dev channel run: the build of this commit (build.sh), as
  # home-ve-<commit>-linux-x64.tar.gz on the pre-release "dev", where deploy/fetch-build.sh downloads it.
  # Only for pushes to main, and only once every check above has passed.
  dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, scripts]
    runs-on: ubuntu-24.04
    # this job alone may write: it uploads to the releases
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: ./build.sh
      - name: Package
        run: .github/package.sh "home-ve-$GITHUB_SHA-linux-x64.tar.gz"
      - name: Upload to the pre-release "dev"
        run: |
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --target "$GITHUB_SHA" --title "dev builds" \
              --notes "Builds of every commit on main, for hosts on the dev channel: not a release. The newest 30 are kept."
          fi
          # the .sha256 last: hosts take a build once its .sha256 is there (deploy/fetch-build.sh)
          gh release upload dev "home-ve-$GITHUB_SHA-linux-x64.tar.gz" --clobber
          gh release upload dev "home-ve-$GITHUB_SHA-linux-x64.tar.gz.sha256" --clobber
      - name: Keep the newest 30 builds
        run: |
          gh release view dev --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[60:] | .[].name' |
            while read -r name; do gh release delete-asset dev "$name" --yes; done
