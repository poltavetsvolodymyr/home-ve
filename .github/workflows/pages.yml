# Publishes the landing page (site/) to GitHub Pages, with the screenshots from docs/screenshots.
# The custom domain (site/CNAME) is set in the repository's Settings → Pages; the source there is "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits instead of cancelling one that is half published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.jpg _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
