# The installer image's boot menu on BIOS, plain like GRUB's: build-live.sh puts it over live-build's. The
# entries and their options are those of grub.cfg (UEFI), see there.
ui vesamenu.c32
menu title home-ve installer
menu background #ff000000
menu width 44
menu margin 4
menu rows 3
# in the middle of the 80x30 screen; the shift applies to the countdown's row too (18 + 10)
menu hshift 18
menu vshift 10
menu timeoutrow 8
menu tabmsg
menu autoboot Starting in # s
menu color screen      37;40 #ffbbbbbb #ff000000 none
menu color border      30;40 #ff000000 #ff000000 none
menu color title    1;37;40 #ffffffff #ff000000 none
menu color unsel       37;40 #ffbbbbbb #ff000000 none
menu color sel      7;37;40 #ff000000 #ffbbbbbb none
menu color timeout_msg 37;40 #ff888888 #ff000000 none
menu color timeout     37;40 #ff888888 #ff000000 none
timeout 50
default install

label install
  menu label Install home-ve
  kernel /live/vmlinuz
  append initrd=/live/initrd.img boot=live noswap quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0

label safe
  menu label Install home-ve (safe graphics)
  kernel /live/vmlinuz
  append initrd=/live/initrd.img boot=live noswap quiet loglevel=3 systemd.show_status=false nomodeset

label disk
  menu label Boot from the first disk
  localboot 0x80
