# The installer image's boot menu on UEFI (Debian's signed GRUB reads it from /boot/grub/grub.cfg), plain like an
# installed system's: build-live.sh puts it over live-build's. isolinux.cfg is the same menu for BIOS.
#   quiet loglevel=3 systemd.show_status=false: no boot messages, the screen goes from here to the page
#   vt.global_cursor_default=0: no blinking cursor meanwhile
#   nomodeset: no graphics driver, so the screen shows the address and the code as text
set default=0
set timeout=5
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

menuentry "Install home-ve" {
	linux	/live/vmlinuz boot=live quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0
	initrd	/live/initrd.img
}
menuentry "Install home-ve (safe graphics)" {
	linux	/live/vmlinuz boot=live quiet loglevel=3 systemd.show_status=false nomodeset
	initrd	/live/initrd.img
}
menuentry "Boot from the first disk" {
	exit
}
