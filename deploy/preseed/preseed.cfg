# Answers for the Debian 13 installer: a host for home-ve, set up the way docs/deployment.md does it by hand.
# On the installer's boot menu: Advanced options -> Automated install, then this file's URL, e.g.
#   https://raw.githubusercontent.com/poltavetsvolodymyr/home-ve/stable/deploy/preseed/preseed.cfg
# (".../main/..." installs the dev channel's version of these files).
#
# Asked, on purpose: which disk (it is erased whole), the root password and your user. Everything else is here:
#   - English, US keyboard, time zone Europe/Berlin (all changeable later), host name "home";
#   - the disk: /boot, then LVM in the volume group "home": root 30 GB, swap 2 GB, the rest left free
#     (recipe.sh). On the first boot, firstboot.sh makes the backup volume (a quarter of the group) and the thin
#     pool "data" (the rest), as in docs/deployment.md;
#   - a minimal system with SSH; git, curl and thin-provisioning-tools for home-ve;
#   - at the end late.sh: the checkout in /opt/home-ve, the bridge br0 on the installer's network card, and the
#     first-boot service that runs install.sh.

### "Automated install" asks only the critical questions; from here on the important ones too, so that what is not
### answered here (the disk, the passwords, your user) is asked instead of guessed
d-i debconf/priority select high

### Language, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

### Network: the first card with a link, by DHCP; the name "home" whatever DHCP says
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string home
d-i netcfg/get_domain string
d-i netcfg/hostname string home
d-i hw-detect/load_firmware boolean true

### Packages from deb.debian.org
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false

### Disk. Which one is asked; recipe.sh picks the layout for BIOS or UEFI. partman-lvm/confirm, the question
### that names the disk whose contents are about to go, is left to you; the questions after it are answered.
d-i preseed/run string recipe.sh
d-i partman-auto/method string lvm
d-i partman-auto-lvm/new_vg_name string home
# the system's volumes take at most this much of the group; the rest stays free for the backups and the VMs
d-i partman-auto-lvm/guided_size string 34GB
d-i partman-partitioning/default_label string gpt
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Software: the base system, SSH, and what home-ve's scripts need first (install.sh adds the rest)
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string git curl ca-certificates thin-provisioning-tools
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader: onto the primary drive (with one disk: that one; on UEFI, the EFI partition)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### home-ve. late.sh comes from next to this file and takes the same branch (stable, or main).
d-i preseed/late_command string \
    url="$(debconf-get preseed/url)"; \
    wget -q -O /target/root/home-ve-late.sh "${url%/*}/late.sh" && \
    in-target bash /root/home-ve-late.sh "$url"

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
