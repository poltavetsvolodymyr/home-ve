# nginx site for the web UI: install.sh puts it into /etc/nginx/sites-available/home on every run, so edits
# there don't last. Which certificate is in /etc/nginx/home-ve/tls.conf, which install.sh writes only once
# (a self-signed one) and then leaves to you: point it at a real certificate there (docs/deployment.md).

# the console is a WebSocket: pass "Upgrade" on when the browser asks for it
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# plain http: everything moves to https
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/home-ve/tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/home;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # the page itself (also for every address of the app, through try_files above): asked anew each time,
    # so after an update the browser gets the new one, which names the new build's files
    # (nginx: an add_header here hides those of the server block, e.g. an HSTS line put into tls.conf; repeat
    # such a line in both locations below)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # the build's files have their content's hash in the name: a name never gets other content. One that is
    # gone (from the build before an update) is a 404, not the page: the app then reloads (main.tsx)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the VM console: a WebSocket that stays open as long as the tab does
    location ~ ^/api/vms/[^/]+/console$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
