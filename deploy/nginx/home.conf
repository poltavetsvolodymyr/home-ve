# nginx site for the web UI on the host "home": /etc/nginx/sites-available/home
# TLS with the *.vladpolt.com certificate that acme.sh puts into /etc/nginx/tls (docs/deployment.md).

# the console is a WebSocket: pass "Upgrade" on when the browser asks for it
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# plain http: everything moves to https
server {
    listen 80 default_server;
    server_name _;
    return 301 https://home.vladpolt.com$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name home.vladpolt.com;

    ssl_certificate     /etc/nginx/tls/vladpolt.com.crt;
    ssl_certificate_key /etc/nginx/tls/vladpolt.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/home;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the VM console: a WebSocket that stays open as long as the tab does
    location ~ ^/api/vms/[^/]+/console$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
